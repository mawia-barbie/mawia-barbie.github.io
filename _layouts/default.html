<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <link
      rel="stylesheet"
      href="{{ '/assets/css/jekyll-theme-chirpy.css' | relative_url }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Global Design Tokens: Mauve Terminal Theme ── */
      :root {
        --mauve: #c9a0dc;
        --mauve-light: #e6c8f0;
        --mauve-dark: #9b6fa0;
        --mauve-glow: rgba(201, 160, 220, 0.35);
        --terminal-bg: #0d0b14;
        --bg-dark: #0f0d1a;
        --bg-card: rgba(201, 160, 220, 0.04);
        --on-background: #e5e1e4;
        --muted: #c4b0cc;
        --neon-pink: var(--mauve);
        --neon-blue: #22d3ee;
        --neon-purple: #8b5cf6;
        --primary: var(--mauve);
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        color: var(--on-background);
        background:
          radial-gradient(circle at 10% 10%, rgba(201, 160, 220, 0.03), transparent 6%),
          radial-gradient(circle at 90% 90%, rgba(201, 160, 220, 0.03), transparent 12%),
          linear-gradient(180deg, #07060b, var(--bg-dark));
        scroll-behavior: smooth;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        line-height: 1.35;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .font-mono, code, pre, kbd, .label-mono {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace !important;
      }

      .site-viewport {
        display: flex;
        min-height: 100vh;
        width: 100%;
        position: relative;
      }

      h1, h2, h3, h4 { color: var(--mauve-light) !important; }
      p { color: var(--muted); }
      a, a:link, a:visited { color: var(--mauve) !important; text-decoration: none !important; }
      a:hover { color: var(--mauve-light) !important; }

      ::selection { background: rgba(201, 160, 220, 0.2); color: #fff; }

      /* ── Navigation ── */
      .top-nav {
        position: absolute;
        top: 18px;
        right: 36px;
        display: flex;
        gap: 10px;
        align-items: center;
        z-index: 60;
      }
      .top-nav a {
        color: rgba(230, 237, 243, 0.8);
        border: 1px solid rgba(201, 160, 220, 0.08);
        padding: 7px 11px;
        border-radius: 6px;
        font-size: 12px;
        text-decoration: none;
        transition: all 160ms ease;
        background: rgba(13, 11, 20, 0.5);
        backdrop-filter: blur(8px);
        font-family: "JetBrains Mono", monospace;
        letter-spacing: 0.5px;
      }
      .top-nav a:hover {
        color: var(--mauve-light);
        box-shadow: 0 8px 30px rgba(201, 160, 220, 0.1);
        transform: translateY(-2px);
        border-color: rgba(201, 160, 220, 0.2);
      }

      /* ── Glass Card Component ── */
      .glass-card {
        background: rgba(13, 11, 20, 0.6) !important;
        backdrop-filter: blur(12px) !important;
        border: 1px solid rgba(201, 160, 220, 0.06) !important;
        border-radius: 12px !important;
        padding: 24px !important;
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }
      .glass-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 48px rgba(201, 160, 220, 0.06);
        border-color: rgba(201, 160, 220, 0.15) !important;
      }

      /* ── Neon Button ── */
      .neon-btn {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 6px;
        border: 1px solid rgba(201, 160, 220, 0.15);
        background: transparent;
        color: var(--mauve) !important;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .neon-btn:hover {
        background: rgba(201, 160, 220, 0.08);
        border-color: rgba(201, 160, 220, 0.3);
        transform: translateY(-3px);
        box-shadow: 0 10px 40px rgba(201, 160, 220, 0.08);
      }

      /* ── Terminal Section Header ── */
      .term-section-header {
        margin-bottom: 32px;
      }
      .term-section-badge {
        display: inline-block;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: rgba(201, 160, 220, 0.3);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .term-section-header h1, .term-section-header h2 {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--mauve-light) !important;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-left: 3px solid var(--mauve);
        padding-left: 16px;
      }

      /* ── Utility ── */
      #sidebar, #mask, #sidebar-trigger, .sidebar-bottom { display: none !important; }
      #main-wrapper, #main-wrapper .container, .site-viewport > :not(.top-nav) {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      body[sidebar-display] { padding-left: 0 !important; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 900px) {
        .site-viewport { flex-direction: column; }
        .top-nav { right: 16px; top: 12px; gap: 6px; }
        .top-nav a { font-size: 11px; padding: 5px 8px; }
      }
    </style>
  </head>
  <body>
    <div class="site-viewport">
      <nav class="top-nav" aria-label="Top navigation">
        <a href="/">~/home</a>
        <a href="/about/">~/about</a>
        <a href="/categories/">~/projects</a>
        <a href="/tags/">~/tags</a>
      </nav>

      {{ content }}
    </div>
  </body>
</html>
