<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <link
      rel="stylesheet"
      href="{{ '/assets/css/jekyll-theme-chirpy.css' | relative_url }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #ffafd7; /* primary accent from your Tailwind config */
        --neon-pink: var(--primary);
        --neon-blue: #22d3ee;
        --neon-purple: #8b5cf6;
        --bg-dark: #131315; /* matches your design */
        --on-background: #e5e1e4;
        --muted: #dac0ca;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background:
          radial-gradient(
            circle at 2px 2px,
            rgba(255, 175, 215, 0.03) 1px,
            transparent 0
          ),
          radial-gradient(
            circle at 10% 10%,
            rgba(139, 92, 246, 0.03),
            transparent 6%
          ),
          radial-gradient(
            circle at 90% 90%,
            rgba(245, 169, 197, 0.03),
            transparent 12%
          ),
          linear-gradient(180deg, #07070b, var(--bg-dark));
        color: var(--on-background) !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial;
        line-height: 1.35;
        background-color: var(--bg-dark) !important;
        color: var(--on-background) !important;
      }

      /* Code / mono font for labels and terminal accents */
      .font-code-sm,
      pre,
      code,
      kbd,
      .label-mono {
        font-family:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco,
          monospace;
      }

      /* Ensure content fills the viewport */
      .site-viewport {
        display: flex;
        min-height: 100vh;
        width: 100%;
      }

      /* Top navigation (new) */
      .top-nav {
        position: absolute;
        top: 18px;
        right: 36px;
        display: flex;
        gap: 14px;
        align-items: center;
        z-index: 60;
      }
      .top-nav a {
        color: rgba(230, 237, 243, 0.9);
        border: 1px solid rgba(245, 169, 197, 0.08);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        text-decoration: none;
        transition: all 160ms ease;
        background: rgba(11, 15, 25, 0.25);
      }
      .top-nav a:hover {
        color: var(--neon-pink);
        box-shadow: 0 8px 30px rgba(245, 169, 197, 0.12);
        transform: translateY(-2px);
      }

      /* HUD, panels and glows */
      .hud-panel {
        background: rgba(11, 15, 25, 0.65) !important;
        border: 1px solid rgba(245, 169, 197, 0.12) !important;
        box-shadow: 0 6px 30px rgba(245, 169, 197, 0.04) !important;
        backdrop-filter: blur(8px) !important;
        padding: 14px !important;
        border-radius: 6px !important;
      }

      /* Buttons */
      .neon-btn {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 6px;
        border: 1px solid rgba(245, 169, 197, 0.25);
        background: transparent;
        color: var(--neon-pink);
        box-shadow: 0 6px 24px rgba(245, 169, 197, 0.06);
      }
      .neon-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 40px rgba(245, 169, 197, 0.12);
      }

      /* Footer glow */
      .glow-footer {
        background: linear-gradient(
          to top,
          rgba(139, 92, 246, 0.12),
          transparent
        );
        height: 120px;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* Utility overrides */
      a,
      a:link,
      a:visited {
        color: var(--neon-pink) !important;
        text-decoration: none !important;
      }
      h1,
      h2,
      h3,
      h4 {
        color: var(--neon-pink) !important;
      }

      /* Ensure components that used old variables are overridden */
      .text-primary,
      .bg-primary {
        color: var(--neon-pink) !important;
        background-color: transparent !important;
      }
      .text-on-surface,
      .text-on-surface-variant {
        color: var(--muted) !important;
      }

      /* Responsive tweaks */
      @media (max-width: 900px) {
        .site-viewport {
          flex-direction: column;
        }
      }

      /* Hide Chirpy left sidebar on pages using this layout */
      #sidebar,
      #mask,
      #sidebar-trigger,
      .sidebar-bottom {
        display: none !important;
      }
      #main-wrapper,
      #main-wrapper .container,
      .site-viewport > :not(.top-nav) {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
    </style>
  </head>
  <body>
    <div class="site-viewport">
      <nav class="top-nav" aria-label="Top navigation">
        <a href="/">/home</a>
        <a href="/about/">/about</a>
        <a href="/categories/">/categories</a>
      </nav>

      {{ content }}
    </div>

    <div class="glow-footer" aria-hidden="true"></div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        try {
          var topNav = document.querySelector(".top-nav");
          if (topNav) {
            var homeLink = topNav.querySelector('a[href="/"]');
            if (homeLink && topNav.firstElementChild !== homeLink) {
              topNav.insertBefore(homeLink, topNav.firstElementChild);
            }
          }
        } catch (e) {}
      });
    </script>
  </body>
</html>
